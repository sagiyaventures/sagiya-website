<svg width="720" height="720" viewBox="0 0 720 720" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="beamGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#006400" stop-opacity="0" />
      <stop offset="100%" stop-color="#006400" stop-opacity="0.85" />
    </linearGradient>
    <linearGradient id="beamGreenOut" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#006400" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#006400" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="chipFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2a0f" />
      <stop offset="100%" stop-color="#0a1f0a" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe2da" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#ffe2da" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowGreen" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#006400" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#006400" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Ambient background glows -->
  <circle cx="360" cy="360" r="340" fill="url(#glow)" />
  <circle cx="500" cy="220" r="220" fill="url(#glowGreen)" />

  <!-- Incoming light beams (left side, into the chip) -->
  <g stroke-linecap="round">
    <line x1="20" y1="220" x2="255" y2="280" stroke="url(#beamGreen)" stroke-width="3" />
    <line x1="10" y1="300" x2="255" y2="320" stroke="url(#beamGreen)" stroke-width="4" />
    <line x1="20" y1="380" x2="255" y2="360" stroke="url(#beamGreen)" stroke-width="3" />
    <line x1="10" y1="460" x2="255" y2="400" stroke="url(#beamGreen)" stroke-width="4" />
    <line x1="30" y1="520" x2="255" y2="440" stroke="url(#beamGreen)" stroke-width="3" />
  </g>

  <!-- Outgoing light beams (right side, out of the chip) -->
  <g stroke-linecap="round">
    <line x1="465" y1="280" x2="700" y2="200" stroke="url(#beamGreenOut)" stroke-width="3" />
    <line x1="465" y1="320" x2="710" y2="280" stroke="url(#beamGreenOut)" stroke-width="4" />
    <line x1="465" y1="360" x2="700" y2="360" stroke="url(#beamGreenOut)" stroke-width="3" />
    <line x1="465" y1="400" x2="710" y2="440" stroke="url(#beamGreenOut)" stroke-width="4" />
    <line x1="465" y1="440" x2="700" y2="520" stroke="url(#beamGreenOut)" stroke-width="3" />
  </g>

  <!-- Photonic chip die -->
  <rect x="255" y="255" width="210" height="210" rx="18" fill="url(#chipFace)" stroke="#006400" stroke-width="2" />

  <!-- Waveguide mesh (Mach-Zehnder interferometer grid) -->
  <g stroke="#3a9d3a" stroke-width="1.4" opacity="0.65">
    <line x1="285" y1="255" x2="285" y2="465" />
    <line x1="325" y1="255" x2="325" y2="465" />
    <line x1="365" y1="255" x2="365" y2="465" />
    <line x1="405" y1="255" x2="405" y2="465" />
    <line x1="255" y1="285" x2="465" y2="285" />
    <line x1="255" y1="325" x2="465" y2="325" />
    <line x1="255" y1="365" x2="465" y2="365" />
    <line x1="255" y1="405" x2="465" y2="405" />
    <line x1="255" y1="445" x2="465" y2="445" />
  </g>

  <!-- Node junction glow points -->
  <g fill="#00c853">
    <circle cx="285" cy="285" r="3.5" />
    <circle cx="325" cy="325" r="3.5" />
    <circle cx="365" cy="365" r="4.5" />
    <circle cx="405" cy="405" r="3.5" />
    <circle cx="325" cy="405" r="3" />
    <circle cx="405" cy="325" r="3" />
    <circle cx="285" cy="445" r="3" />
    <circle cx="445" cy="285" r="3" />
  </g>

  <!-- Central bright core -->
  <circle cx="365" cy="365" r="10" fill="#00e676" opacity="0.9" />
  <circle cx="365" cy="365" r="22" fill="none" stroke="#00e676" stroke-width="1.5" opacity="0.4" />

  <!-- Chip label ticks -->
  <g fill="#ffdbd0" opacity="0.9">
    <rect x="250" y="270" width="6" height="10" rx="1" />
    <rect x="250" y="440" width="6" height="10" rx="1" />
    <rect x="464" y="270" width="6" height="10" rx="1" />
    <rect x="464" y="440" width="6" height="10" rx="1" />
  </g>
</svg>
